# 安全配置
security:
  # 验证码
  captcha:
    # 是否开启验证码
    enabled: true
    # 验证码类型 math 数组计算 char 字符验证
    type: math
    # 数字验证码位数
    numberLength: 1
    # 字符验证码长度
    charLength: 4

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# 测试环境按迁移基线保留原项目小程序凭据。
weixin:
  miniapp:
    apps:
      - app-id: wx5048434aca406876
        app-secret: ${YM_AUTH_APP_SECRET}
      - app-id: wx6a55a4621e61eea9
        app-secret: ${YM_AUTH_APP_SECRET}

# 三方授权
