# 统一消息推送配置
message:
  enabled: true
  # sse / websocket
  transport: sse
  # 网关会移除 /resource 前缀，System 内部仍使用 /message
  path: /message
  allowedOrigins: '*'
  sse-timeout: 86400000
  heartbeat-interval: 60
  web-socket-send-time-limit: 10000
  web-socket-buffer-size-limit: 64000

mail:
  enabled: false
  host: smtp.163.com
  port: 465
  auth: true
  from: xxx@163.com
  user: xxx@163.com
  pass: xxxxxxxxxx
  starttlsEnable: true
  sslEnable: true
  timeout: 0
  connectionTimeout: 0

sms:
  config-type: yaml
  restricted: true
  minute-max: 1
  account-max: 30
  blends:
    config1:
      supplier: alibaba
      access-key-id: 您的accessKey
      access-key-secret: ${YM_SYSTEM_ACCESS_KEY_SECRET}
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId
    config2:
      supplier: tencent
      access-key-id: 您的accessKey
      access-key-secret: ${YM_SYSTEM_ACCESS_KEY_SECRET}
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId

# Dbo 运营端通过 Dubbo 应用级服务发现调用系统与资源控制契约。
dubbo:
  application:
    register-mode: instance
