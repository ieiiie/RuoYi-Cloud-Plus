# 本地开发机预算：Docker Desktop 10 GiB，宿主保留 IDE/浏览器/前端余量。
x-ym-runtime: &ym-runtime
  restart: unless-stopped
  init: true
  cpus: 2
  mem_limit: 768m
  mem_reservation: 384m
  memswap_limit: 1g
  stop_grace_period: 60s
  logging: &bounded-logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"
  # 使用 exec 让 Java 接收 SIGTERM，不依赖镜像 shell 转发。
  entrypoint:
    - /bin/bash
    - -ec
    - exec java -Djava.security.egd=file:/dev/./urandom -Dserver.port=$${SERVER_PORT} $${JAVA_OPTS} -jar app.jar
  # 仅检查无需鉴权的 HTTP 存活；不绕过 Actuator 授权。
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent --max-time 4 http://127.0.0.1:$${SERVER_PORT}/ >/dev/null"]
    interval: 20s
    timeout: 5s
    start_period: 120s
    retries: 5

services:
  mysql:
    image: mysql:8.4.9
    container_name: mysql
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # root 密码
      MYSQL_ROOT_PASSWORD: ${DOCKER_COMPOSE_MYSQL_ROOT_PASSWORD}
      # 初始化数据库
      MYSQL_DATABASE: ry-cloud
    ports:
      - "3306:3306"
    volumes:
      # 数据挂载
      - /docker/mysql/data/:/var/lib/mysql/
      # 配置挂载
      - /docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    network_mode: "host"

  nacos:
    image: nacos/nacos-server:v3.2.3
    container_name: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "18080:18080"
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      # 仅启动配置中心与服务发现，不加载 AI/Agent/Skill 模块。
      FUNCTION_MODE: microservice
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      # 认证相关密钥 自行替换
      NACOS_AUTH_TOKEN: ${DOCKER_COMPOSE_NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ym-vue-plus-key
      NACOS_AUTH_IDENTITY_VALUE: ym-vue-plus-value
    volumes:
      - /docker/nacos/logs/:/home/nacos/logs
      # 默认单机模式 使用 mysql 等按 nacos 文档在配置文件内修改 所有配置均可在配置文件修改
      - /docker/nacos/conf/application.properties:/home/nacos/conf/application.properties
    network_mode: "host"

  redis:
    image: redis:8.6.3
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/redis/conf:/redis/config
      # 数据文件
      - /docker/redis/data/:/redis/data/
    command: "redis-server /redis/config/redis.conf"
    privileged: true
    network_mode: "host"

  snail-job-server:
    image: opensnail/snail-job:2.0.2
    container_name: snail-job-server
    restart: unless-stopped
    init: true
    cpus: 2
    mem_limit: 1g
    mem_reservation: 512m
    memswap_limit: 1280m
    stop_grace_period: 60s
    logging: *bounded-logging
    # 镜像 Cmd 不读取 JAVA_OPTS，显式覆盖为有界 G1 进程。
    command: ["java", "-Xms128m", "-Xmx384m", "-Xss512k", "-XX:MaxMetaspaceSize=192m", "-XX:ReservedCodeCacheSize=64m", "-XX:MaxDirectMemorySize=64m", "-XX:ActiveProcessorCount=2", "-XX:+UseG1GC", "-XX:+ExitOnOutOfMemoryError", "-jar", "app.jar"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:8089/snail-job/"]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 5
    environment:
      TZ: Asia/Shanghai
      # 控制台在容器内使用独立端口，仅映射到测试宿主机回环地址。
      SERVER_PORT: 8089
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/snail_job?useSSL=false&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SNAIL_JOB_DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SNAIL_JOB_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
    # 控制台仅监听测试宿为回环地址，不加入 Gateway 路由。
    ports:
      - "127.0.0.1:8089:8089"
      - "127.0.0.1:17888:17888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - snail-job-logs:/snail-job/logs
    depends_on:
      - mysql

  minio:
    # pgsty 开源社区 fork 重新维护的最新版 minio
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: minio
    ports:
      # api 端口
      - "9000:9000"
      # 控制台端口
      - "9001:9001"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 管理后台用户名
      MINIO_ROOT_USER: ruoyi
      # 管理后台密码，最小8个字符
      MINIO_ROOT_PASSWORD: ${DOCKER_COMPOSE_MINIO_ROOT_PASSWORD}
      # https需要指定域名
      #MINIO_SERVER_URL: "https://xxx.com:9000"
      #MINIO_BROWSER_REDIRECT_URL: "https://xxx.com:9001"
      # 开启压缩 on 开启 off 关闭
      MINIO_COMPRESS: "off"
      # 扩展名 .pdf,.doc 为空 所有类型均压缩
      MINIO_COMPRESS_EXTENSIONS: ""
      # mime 类型 application/pdf 为空 所有类型均压缩
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      # 映射当前目录下的data目录至容器内/data目录
      - /docker/minio/data:/data
      # 映射配置目录
      - /docker/minio/config:/root/.minio/
    command: server --address ':9000' --console-address ':9001' /data  # 指定容器中的目录 /data
    privileged: true
    network_mode: "host"

  seata-server:
    image: apache/seata-server:2.6.0
    container_name: seata-server
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
      TZ: Asia/Shanghai
      # 注意 此处ip如果是外网使用 要改为外网ip
      # SEATA_IP: 127.0.0.1
      SEATA_PORT: 8091
    volumes:
      - /docker/seata/conf/application.yml:/seata-server/resources/application.yml
      - /docker/seata/logs/:/root/logs/seata
    privileged: true
    network_mode: "host"

  nginx-web:
    image: nginx:1.31.1
    container_name: nginx-web
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书映射
      - /docker/nginx/cert:/etc/nginx/cert
      # 配置文件映射
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      # 页面目录
      - /docker/nginx/html:/usr/share/nginx/html
      # 日志目录
      - /docker/nginx/log:/var/log/nginx
    privileged: true
    network_mode: "host"

  ym-gateway:
    <<: *ym-runtime
    image: ym-gateway:tenant-session-3a31725dfe8b
    container_name: ym-gateway
    restart: unless-stopped
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # bridge 网络下通过宿主网关访问 Nacos
      SPRING_CLOUD_NACOS_SERVER_ADDR: host.docker.internal:8848
      JAVA_OPTS: -Xms128m -Xmx256m -Xss512k -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dserver.shutdown=graceful -Dspring.lifecycle.timeout-per-shutdown-phase=30s
    mem_limit: 768m
    ports:
      - "127.0.0.1:18081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 配置文件
      - ym-gateway-logs:/ym/gateway/logs
      # skywalking 探针
      - ym-skywalking-agent:/ym/skywalking/agent
    privileged: true

  ym-auth:
    <<: *ym-runtime
    image: ym-auth:tenant-session-917c3764c614
    container_name: ym-auth
    restart: unless-stopped
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms128m -Xmx256m -Xss512k -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dserver.shutdown=graceful -Dspring.lifecycle.timeout-per-shutdown-phase=30s
    mem_limit: 768m
    ports:
      - "9210:9210"
    volumes:
      # 配置文件
      - ym-auth-logs:/ym/auth/logs
      # skywalking 探针
      - ym-skywalking-agent:/ym/skywalking/agent
    privileged: true
    network_mode: "host"

  ym-system:
    <<: *ym-runtime
    image: ym-system:tenant-session-cd02698ed6f9
    container_name: ym-system
    restart: unless-stopped
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms128m -Xmx256m -Xss512k -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dserver.shutdown=graceful -Dspring.lifecycle.timeout-per-shutdown-phase=30s
    mem_limit: 768m
    ports:
      - "9201:9201"
    volumes:
      # 配置文件
      - ym-system-logs:/ym/system/logs
      # skywalking 探针
      - ym-skywalking-agent:/ym/skywalking/agent
    privileged: true
    network_mode: "host"

  ym-dbo:
    <<: *ym-runtime
    image: ym-dbo:tenant-session-dcb5e90a3c8f
    container_name: ym-dbo
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms128m -Xmx256m -Xss512k -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dserver.shutdown=graceful -Dspring.lifecycle.timeout-per-shutdown-phase=30s
      NACOS_SERVER_ADDR: 127.0.0.1:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${DOCKER_COMPOSE_NACOS_PASSWORD}
    mem_limit: 768m
    ports:
      - "9203:9203"
    volumes:
      - ym-dbo-logs:/ym/dbo/logs
      - ym-skywalking-agent:/ym/skywalking/agent
    privileged: true
    network_mode: "host"

  ym-agriculture:
    <<: *ym-runtime
    image: ym/ym-agriculture:6.0.0
    container_name: ym-agriculture
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms128m -Xmx384m -Xss512k -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dserver.shutdown=graceful -Dspring.lifecycle.timeout-per-shutdown-phase=30s
      SNAIL_JOB_ENABLED: ${SNAIL_JOB_ENABLED:-true}
      SNAIL_JOB_SERVER_HOST: ${SNAIL_JOB_SERVER_HOST:-host.docker.internal}
      SNAIL_JOB_SERVER_PORT: ${SNAIL_JOB_SERVER_PORT:-17888}
      SNAIL_JOB_TOKEN: ${SNAIL_JOB_TOKEN:?Set the existing local scheduler token in private .env}
    mem_limit: 1g
    memswap_limit: 1280m
    ports:
      - "9221:9221"
      - "17891:17891"
    volumes:
      - ym-agriculture-logs:/ym/agriculture/logs
      - ym-skywalking-agent:/ym/skywalking/agent
    privileged: true
    network_mode: "host"

  ym-iot:
    <<: *ym-runtime
    image: ym/ym-iot:6.0.0
    container_name: ym-iot
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms128m -Xmx256m -Xss512k -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dserver.shutdown=graceful -Dspring.lifecycle.timeout-per-shutdown-phase=30s
      SNAIL_JOB_ENABLED: ${SNAIL_JOB_ENABLED:-true}
      SNAIL_JOB_SERVER_HOST: ${SNAIL_JOB_SERVER_HOST:-host.docker.internal}
      SNAIL_JOB_SERVER_PORT: ${SNAIL_JOB_SERVER_PORT:-17888}
      SNAIL_JOB_TOKEN: ${SNAIL_JOB_TOKEN:?Set the existing local scheduler token in private .env}
    mem_limit: 768m
    ports:
      - "9222:9222"
      - "17892:17892"
    volumes:
      - ym-iot-logs:/ym/iot/logs
      - ym-skywalking-agent:/ym/skywalking/agent
    privileged: true
    network_mode: "host"

  ym-agriculture-miniapp:
    <<: *ym-runtime
    image: ym/ym-agriculture-miniapp:6.0.0
    container_name: ym-agriculture-miniapp
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms128m -Xmx256m -Xss512k -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dserver.shutdown=graceful -Dspring.lifecycle.timeout-per-shutdown-phase=30s
    mem_limit: 768m
    ports:
      - "9223:9223"
    volumes:
      - ym-agriculture-miniapp-logs:/ym/agriculture-miniapp/logs
      - ym-skywalking-agent:/ym/skywalking/agent
    privileged: true
    network_mode: "host"

  ym-farm-task-miniapp:
    <<: *ym-runtime
    image: ym/ym-farm-task-miniapp:6.0.0
    container_name: ym-farm-task-miniapp
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms128m -Xmx256m -Xss512k -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dserver.shutdown=graceful -Dspring.lifecycle.timeout-per-shutdown-phase=30s
    mem_limit: 768m
    ports:
      - "9224:9224"
    volumes:
      - ym-farm-task-miniapp-logs:/ym/farm-task-miniapp/logs
      - ym-skywalking-agent:/ym/skywalking/agent
    privileged: true
    network_mode: "host"

#################################################################################################
#################################### 以下为扩展根据需求搭建 #########################################
#################################################################################################

  elasticsearch:
    image: elasticsearch:8.19.16
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 设置集群名称
      cluster.name: elasticsearch
      # 以单一节点模式启动
      discovery.type: single-node
      # 默认关闭认证 便于本地联调; 如开启 xpack.security.enabled 需手动初始化 Kibana/Logstash/SkyWalking 账号密码
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - /docker/elk/elasticsearch/plugins:/usr/share/elasticsearch/plugins
      - /docker/elk/elasticsearch/data:/usr/share/elasticsearch/data
      - /docker/elk/elasticsearch/logs:/usr/share/elasticsearch/logs
    network_mode: "host"

  kibana:
    image: kibana:8.19.16
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      # kibana在elasticsearch启动之后再启动
      - elasticsearch
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      #设置系统语言文中文
      I18N_LOCALE: zh-CN
      # 访问域名
      # SERVER_PUBLICBASEURL: https://kibana.cloud.com
    volumes:
      - /docker/elk/kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
    network_mode: "host"

  logstash:
    image: logstash:8.19.16
    container_name: logstash
    ports:
      - "4560:4560"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      - /docker/elk/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - /docker/elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    depends_on:
      - elasticsearch
    network_mode: "host"

  rmqnamesrv:
    image: apache/rocketmq:5.5.0
    container_name: rmqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT: -server -Xms512m -Xmx512m
    command: sh mqnamesrv
    volumes:
      - /docker/rocketmq/namesrv/logs:/home/rocketmq/logs/rocketmqlogs
    network_mode: "host"

  rmqbroker1:
    image: apache/rocketmq:5.5.0
    container_name: rmqbroker1
    ports:
      - "10911:10911"
      - "10909:10909"
      - "10912:10912"
    environment:
      JAVA_OPT: -server -Xms512M -Xmx512M
      NAMESRV_ADDR: 127.0.0.1:9876
    # --enable-proxy 开启broker与proxy共用模式 生产部署建议将proxy单独部署
    command: sh mqbroker --enable-proxy -c /home/rocketmq/rocketmq-5.5.0/conf/broker.conf
    depends_on:
      - rmqnamesrv
    volumes:
      - /docker/rocketmq/broker1/conf/broker.conf:/home/rocketmq/rocketmq-5.5.0/conf/broker.conf
      - /docker/rocketmq/broker1/logs:/home/rocketmq/logs/rocketmqlogs
      - /docker/rocketmq/broker1/store:/home/rocketmq/store
    privileged: true
    network_mode: "host"

  rmqconsole:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmqconsole
    ports:
      - "19876:19876"
    environment:
      JAVA_OPTS: -Dserver.port=19876 -Drocketmq.namesrv.addr=127.0.0.1:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
    depends_on:
      - rmqnamesrv
    network_mode: "host"

  rabbitmq:
    container_name: rabbitmq
    build:
      context: ./rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ruoyi
      RABBITMQ_DEFAULT_PASS: ruoyi123
    ports:
      - "15672:15672" # 管理界面端口
      - "5672:5672"   # api 端口
    volumes:
      - /docker/rabbitmq/log:/var/log/rabbitmq
      - /docker/rabbitmq/data:/var/lib/rabbitmq
    network_mode: "host"

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 监听端口
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # 实际访问ip 本地用 127 内网用 192 外网用 外网ip
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.31.165:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk" # 使用 kafka-storage.sh random-uuid 生成
    volumes:
      - /docker/kafka/data:/var/lib/kafka/data
    network_mode: "host"

  sky-oap:
    image: apache/skywalking-oap-server:10.4.0
    container_name: sky-oap
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      JAVA_OPTS: -Xms1G -Xmx2G
      #记录数据的有效期，单位天
      SW_CORE_RECORD_DATA_TTL: 7
      #分析指标数据的有效期，单位天
      SW_CORE_METRICS_DATA_TTL: 7
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: 127.0.0.1:9200
      TZ: Asia/Shanghai
    network_mode: "host"

  sky-ui:
    image: apache/skywalking-ui:10.4.0
    container_name: sky-ui
    ports:
      - "18080:18080"
    environment:
      SW_SERVER_PORT: 18080
      SW_OAP_ADDRESS: http://127.0.0.1:12800
      TZ: Asia/Shanghai
    depends_on:
      - sky-oap
    network_mode: "host"

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - /docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    network_mode: "host"

  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    environment:
      TZ: Asia/Shanghai
      # 服务地址 用于指定外网ip或域名
      GF_SERVER_ROOT_URL: ""
      # admin 管理员密码
      GF_SECURITY_ADMIN_PASSWORD: ${DOCKER_COMPOSE_GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - /docker/grafana/grafana.ini:/etc/grafana/grafana.ini
      - /docker/grafana:/var/lib/grafana
    network_mode: "host"

  shardingproxy:
    image: apache/shardingsphere-proxy:5.4.0
    container_name: shardingsphere-proxy
    command: server /data
    ports:
      - "3307:3307"
    volumes:
      - /docker/shardingproxy/conf:/opt/shardingsphere-proxy/conf
      - /docker/shardingproxy/ext-lib:/opt/shardingsphere-proxy/ext-lib
    environment:
      - JVM_OPTS="-Djava.awt.headless=true"
    network_mode: "host"

volumes:
  snail-job-logs:
  ym-gateway-logs:
  ym-auth-logs:
  ym-system-logs:
  ym-dbo-logs:
  ym-agriculture-logs:
  ym-iot-logs:
  ym-agriculture-miniapp-logs:
  ym-farm-task-miniapp-logs:
  ym-skywalking-agent:
