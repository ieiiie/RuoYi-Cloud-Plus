# Tomcat
server:
  port: 8080
  servlet:
    context-path: /

# Spring
spring:
  application:
    # 应用名称
    name: ym-gateway
  profiles:
    # 环境配置
    active: @profiles.active@

--- # nacos 配置
spring:
  cloud:
    nacos:
      # nacos 服务地址
      server-addr: @nacos.server@
      username: @nacos.username@
      password: ${APPLICATION_PASSWORD}
      discovery:
        # 注册组
        group: DEFAULT_GROUP
        namespace: public
      config:
        # 配置组
        group: DEFAULT_GROUP
        namespace: public
  config:
    import:
      - optional:nacos:application-common.yml
      - optional:nacos:${spring.application.name}.yml
